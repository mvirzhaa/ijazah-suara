# ==============================================================================
# Konfigurasi Nginx untuk Subpath: /ijazah-bersuara
# Domain: https://vr.ti.fts.uika-bogor.ac.id/ijazah-bersuara
# ==============================================================================
# Masukkan potongan (snippet) konfigurasi berikut ke dalam blok `server`
# yang sudah ada untuk domain `vr.ti.fts.uika-bogor.ac.id`
# (biasanya di /etc/nginx/sites-available/vr.ti.fts.uika-bogor.ac.id atau default).

location = /ijazah-bersuara {
    return 301 /ijazah-bersuara/;
}

location /ijazah-bersuara/ {
    # Perhatikan trailing slash pada http://127.0.0.1:3000/
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Kapasitas unggah untuk berkas rekaman suara & pindaian gambar ijazah (hingga 25MB)
    client_max_body_size 25M;

    # Timeout pemrosesan model AI embedding & Codec 2
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Nonaktifkan buffering untuk respons streaming atau berkas besar jika diperlukan
    proxy_buffering off;
}
