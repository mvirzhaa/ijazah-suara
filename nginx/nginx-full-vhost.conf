# ==============================================================================
# Full Virtual Host Nginx untuk domain: vr.ti.fts.uika-bogor.ac.id
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name vr.ti.fts.uika-bogor.ac.id;

    # Redirect seluruh HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vr.ti.fts.uika-bogor.ac.id;

    # Sertifikat SSL (sesuaikan dengan path sertifikat Anda atau Certbot)
    ssl_certificate /etc/letsencrypt/live/vr.ti.fts.uika-bogor.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vr.ti.fts.uika-bogor.ac.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Redirect /ijazah-bersuara tanpa trailing slash
    location = /ijazah-bersuara {
        return 301 /ijazah-bersuara/;
    }

    # Reverse proxy ke container Ijazah Bersuara
    location /ijazah-bersuara/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        client_max_body_size 25M;

        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
